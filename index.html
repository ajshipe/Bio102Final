<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Bio Boss Battle</title>
<style>
  :root {
    --navy: #003366;
    --navy-deep: #001a33;
    --navy-light: #1a4d80;
    --gold: #FDB827;
    --gold-deep: #d99a14;
    --gold-soft: #fff4d6;
    --cream: #fefaf0;
    --ink: #0a1628;
    --ink-soft: #2a3a52;
    --muted: #6b7a8f;
    --line: #e4e8f0;
    --success: #2d8659;
    --success-bg: #e6f4ec;
    --error: #c5364f;
    --error-bg: #fde8ec;
    --shadow: 0 4px 20px rgba(0, 51, 102, 0.08);
    --shadow-lg: 0 12px 40px rgba(0, 51, 102, 0.15);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --navy: #4d8fcc;
      --navy-deep: #0a1628;
      --navy-light: #6ba5dc;
      --gold: #FDB827;
      --gold-deep: #ffd166;
      --gold-soft: #2a2412;
      --cream: #0f1825;
      --ink: #e8eef5;
      --ink-soft: #b8c5d6;
      --muted: #8a98ab;
      --line: #1f2d40;
      --success: #4ec48a;
      --success-bg: #15301f;
      --error: #ff6b85;
      --error-bg: #2e1219;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.6);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'Iowan Old Style', 'Palatino', 'Georgia', serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse at top right, rgba(253, 184, 39, 0.08), transparent 50%),
      radial-gradient(ellipse at bottom left, rgba(0, 51, 102, 0.06), transparent 50%),
      var(--cream);
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  input { font-family: inherit; font-size: 16px; }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: 100px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px 20px;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    background: var(--navy);
    border-radius: 8px;
    display: grid;
    place-items: center;
    color: var(--gold);
    font-weight: 900;
    font-family: 'Iowan Old Style', 'Palatino', 'Georgia', serif;
    font-size: 18px;
    box-shadow: 0 2px 8px rgba(0, 51, 102, 0.3);
  }

  .brand-text {
    font-family: 'Iowan Old Style', 'Palatino', 'Georgia', serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--navy);
    letter-spacing: -0.01em;
    line-height: 1;
  }

  .brand-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .notebook-btn {
    background: var(--navy);
    color: var(--gold);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    transition: transform 0.15s;
  }

  .notebook-btn:active { transform: scale(0.96); }

  .notebook-count {
    background: var(--gold);
    color: var(--navy);
    border-radius: 999px;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 800;
    min-width: 20px;
    text-align: center;
  }

  .hero {
    text-align: center;
    padding: 24px 16px 32px;
    margin-bottom: 24px;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    border-radius: 20px;
    color: var(--gold);
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -40px;
    right: -40px;
    width: 160px;
    height: 160px;
    background: radial-gradient(circle, rgba(253, 184, 39, 0.2), transparent 70%);
  }

  .hero-eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 8px;
  }

  .hero-title {
    font-family: 'Iowan Old Style', 'Palatino', 'Georgia', serif;
    font-size: 32px;
    font-weight: 900;
    line-height: 1.05;
    margin-bottom: 12px;
    letter-spacing: -0.02em;
  }

  .hero-sub {
    font-size: 14px;
    opacity: 0.9;
    color: #fff;
    max-width: 380px;
    margin: 0 auto;
    line-height: 1.5;
  }

  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: #fff;
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }

  @media (prefers-color-scheme: dark) { .stat-card { background: #1a2638; } }

  .stat-value {
    font-size: 22px;
    font-weight: 800;
    color: var(--navy);
    font-family: 'Iowan Old Style', 'Palatino', 'Georgia', serif;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .section-title {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin: 8px 4px 14px;
    font-weight: 600;
  }

  .level-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .level-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    transition: transform 0.15s, box-shadow 0.15s;
    min-height: 76px;
    position: relative;
    overflow: hidden;
  }

  @media (prefers-color-scheme: dark) { .level-card { background: #1a2638; } }

  .level-card:active:not(.locked) { transform: scale(0.98); }
  .level-card:not(.locked):hover { box-shadow: var(--shadow); }
  .level-card.locked { opacity: 0.5; cursor: not-allowed; }

  .level-card.cleared::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--gold);
  }

  .level-num {
    width: 44px;
    height: 44px;
    background: var(--navy);
    color: var(--gold);
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 18px;
    flex-shrink: 0;
    font-family: 'Iowan Old Style', 'Palatino', 'Georgia', serif;
  }

  .level-card.cleared .level-num {
    background: var(--gold);
    color: var(--navy);
  }

  .level-card.boss .level-num {
    background: linear-gradient(135deg, var(--navy), var(--gold));
    color: #fff;
    font-size: 20px;
  }

  .level-info { flex: 1; min-width: 0; }

  .level-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.25;
    margin-bottom: 3px;
    font-family: 'Iowan Old Style', 'Palatino', 'Georgia', serif;
  }

  .level-meta {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }

  .level-status {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .level-card.cleared .level-status { color: var(--success); }

  .quiz {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .quiz-header {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }

  @media (prefers-color-scheme: dark) { .quiz-header { background: #1a2638; } }

  .quiz-header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .quiz-back {
    color: var(--navy);
    font-weight: 600;
    font-size: 14px;
    padding: 8px 4px;
    margin: -8px -4px;
    min-height: 36px;
    display: flex;
    align-items: center;
  }

  .quiz-title {
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    text-align: center;
    flex: 1;
    padding: 0 8px;
    line-height: 1.2;
  }

  .quiz-stats {
    display: flex;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
  }

  .stat-pill {
    background: var(--navy);
    color: #fff;
    padding: 4px 8px;
    border-radius: 6px;
  }

  .stat-pill.hp { background: var(--error-bg); color: var(--error); }
  .stat-pill.streak { background: var(--gold-soft); color: var(--gold-deep); }

  .progress-bar {
    height: 6px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--navy), var(--gold));
    transition: width 0.4s ease;
    border-radius: 999px;
  }

  .progress-text {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    text-align: center;
    letter-spacing: 0.05em;
  }

  .question-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    box-shadow: var(--shadow);
    animation: slideIn 0.35s ease;
  }

  @media (prefers-color-scheme: dark) { .question-card { background: #1a2638; } }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-type {
    font-size: 10px;
    color: var(--gold-deep);
    font-weight: 800;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .q-text {
    font-size: 18px;
    line-height: 1.4;
    color: var(--ink);
    margin-bottom: 18px;
    font-weight: 500;
    font-family: 'Iowan Old Style', 'Palatino', 'Georgia', serif;
  }

  .q-scenario {
    background: var(--gold-soft);
    border-left: 3px solid var(--gold);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin-bottom: 16px;
    font-style: italic;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    background: var(--cream);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: left;
    font-size: 15px;
    line-height: 1.4;
    color: var(--ink);
    width: 100%;
    min-height: 52px;
    transition: all 0.15s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  @media (prefers-color-scheme: dark) { .option { background: #0f1825; } }

  .option-letter {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: #fff;
    border: 1.5px solid var(--line);
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 13px;
    color: var(--navy);
    flex-shrink: 0;
  }

  @media (prefers-color-scheme: dark) { .option-letter { background: #1a2638; } }

  .option:active:not(:disabled) { transform: scale(0.98); }
  .option:hover:not(:disabled) { border-color: var(--navy); }

  .option.correct {
    background: var(--success-bg);
    border-color: var(--success);
    color: var(--success);
  }
  .option.correct .option-letter {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
  }
  .option.incorrect {
    background: var(--error-bg);
    border-color: var(--error);
    color: var(--error);
  }
  .option.incorrect .option-letter {
    background: var(--error);
    color: #fff;
    border-color: var(--error);
  }
  .option:disabled { cursor: default; }

  .tf-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .tf-option {
    padding: 18px;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: var(--cream);
    color: var(--ink);
    min-height: 64px;
    transition: all 0.15s;
  }

  @media (prefers-color-scheme: dark) { .tf-option { background: #0f1825; } }

  .tf-option:active:not(:disabled) { transform: scale(0.96); }
  .tf-option.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); }
  .tf-option.incorrect { background: var(--error-bg); border-color: var(--error); color: var(--error); }

  .fill-input-wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .fill-input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid var(--line);
    border-radius: 12px;
    font-size: 16px;
    background: var(--cream);
    color: var(--ink);
    transition: border-color 0.15s;
  }

  @media (prefers-color-scheme: dark) { .fill-input { background: #0f1825; } }

  .fill-input:focus { outline: none; border-color: var(--navy); }
  .fill-input.correct { border-color: var(--success); background: var(--success-bg); color: var(--success); }
  .fill-input.incorrect { border-color: var(--error); background: var(--error-bg); color: var(--error); }

  .submit-btn {
    background: var(--navy);
    color: var(--gold);
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    min-height: 50px;
    transition: transform 0.15s;
    letter-spacing: 0.02em;
  }
  .submit-btn:active:not(:disabled) { transform: scale(0.97); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .feedback {
    border-radius: 14px;
    padding: 16px;
    margin-top: 16px;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .feedback.correct { background: var(--success-bg); border: 1px solid var(--success); }
  .feedback.incorrect { background: var(--error-bg); border: 1px solid var(--error); }

  .feedback-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    margin-bottom: 8px;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .feedback.correct .feedback-header { color: var(--success); }
  .feedback.incorrect .feedback-header { color: var(--error); }

  .feedback-text {
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.5;
  }

  .next-btn {
    background: var(--navy);
    color: var(--gold);
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    min-height: 52px;
    width: 100%;
    margin-top: 14px;
    transition: transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .next-btn:active { transform: scale(0.97); }

  .hint-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
  }

  .hint-btn {
    background: var(--gold-soft);
    color: var(--gold-deep);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    min-height: 36px;
    border: 1px solid var(--gold);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .hint-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .hint-text {
    background: var(--gold-soft);
    border-left: 3px solid var(--gold);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin-top: 12px;
    font-style: italic;
  }

  .results { text-align: center; padding: 12px 8px; }

  .results-icon {
    font-size: 48px;
    margin-bottom: 12px;
    animation: bounce 0.6s ease;
    font-family: 'Iowan Old Style', 'Palatino', 'Georgia', serif;
    color: var(--gold);
    font-weight: 900;
  }

  @keyframes bounce {
    0%, 100% { transform: scale(1); }
    40% { transform: scale(1.15); }
    70% { transform: scale(0.95); }
  }

  .results-title {
    font-family: 'Iowan Old Style', 'Palatino', 'Georgia', serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--navy);
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }

  .results-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .results-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }

  .results-stat {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 8px;
    box-shadow: var(--shadow);
  }

  @media (prefers-color-scheme: dark) { .results-stat { background: #1a2638; } }

  .results-stat-value {
    font-size: 24px;
    font-weight: 900;
    color: var(--navy);
    font-family: 'Iowan Old Style', 'Palatino', 'Georgia', serif;
    line-height: 1;
    margin-bottom: 4px;
  }

  .results-stat-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .results-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .action-btn {
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    min-height: 52px;
    transition: transform 0.15s;
  }

  .action-btn:active { transform: scale(0.97); }
  .action-btn.primary { background: var(--navy); color: var(--gold); }
  .action-btn.secondary { background: var(--gold-soft); color: var(--gold-deep); border: 1px solid var(--gold); }
  .action-btn.tertiary { background: transparent; color: var(--navy); }

  .confetti {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute;
    width: 10px; height: 10px;
    animation: fall 3s ease-out forwards;
  }

  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  .streak-flash {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--gold);
    color: var(--navy);
    padding: 18px 28px;
    border-radius: 16px;
    font-weight: 900;
    font-size: 24px;
    font-family: 'Iowan Old Style', 'Palatino', 'Georgia', serif;
    box-shadow: 0 12px 40px rgba(253, 184, 39, 0.4);
    pointer-events: none;
    z-index: 200;
    animation: streakPop 1.2s ease;
    letter-spacing: -0.02em;
  }

  @keyframes streakPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -55%) scale(1); }
  }

  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 22, 40, 0.5);
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--cream);
    border-radius: 24px 24px 0 0;
    z-index: 301;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    max-height: 80dvh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
  }

  .drawer.open { transform: translateY(0); }

  .drawer-handle {
    width: 40px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 12px auto 8px;
    flex-shrink: 0;
  }

  .drawer-header {
    padding: 12px 20px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;

        answer: 0,

        nb: { term: "Ca²⁺ in muscle contraction", def: "Ca²⁺ binds troponin → tropomyosin shifts → myosin binds actin → contraction." }},

        ],

        ],

    ]
  }
];

// Build a boss battle pool from all level pools
function buildBossPool() {
  const all = [];
  LEVELS.forEach(lvl => {
    lvl.pool.forEach(q => all.push({ ...q, _from: lvl.short }));
  });
  return all;
}

// ============================================================
// GAME STATE
// ============================================================
const state = {
  currentLevel: null,
  currentQ: 0,
  hp: 100,
  xp: 0,
  streak: 0,
  hintsLeft: 2,
  correctCount: 0,
  totalAnswered: 0,
  answered: false,
  notebook: [],
  levelProgress: {},
  questionsThisRun: [],
};

LEVELS.forEach(l => state.levelProgress[l.id] = { best: 0, cleared: false, plays: 0 });
state.levelProgress['boss'] = { best: 0, cleared: false, plays: 0 };

// Shuffle helper (Fisher-Yates)
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Pick 15 questions per level (or 25 for boss). Different shuffle each time.
function pickQuestions(levelId) {
  if (levelId === 'boss') {
    return shuffle(buildBossPool()).slice(0, 25);
  }
  const level = LEVELS.find(l => l.id === levelId);
  return shuffle(level.pool).slice(0, 15);
}

// ============================================================
// RENDERING
// ============================================================

function renderHome() {
  document.getElementById('screen-home').classList.remove('hidden');
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-results').classList.add('hidden');

  const cleared = Object.values(state.levelProgress).filter(p => p.cleared).length;
  const totalLevels = LEVELS.length + 1;

  let html = `
    <div class="hero">
      <div class="hero-eyebrow">Final Exam Prep</div>
      <div class="hero-title">Level up.<br>Learn it cold.</div>
      <div class="hero-sub">Nine lecture levels, one cumulative boss battle. Score 80% to unlock the next level. Replay any level for fresh questions.</div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value">${cleared}/${totalLevels}</div>
        <div class="stat-label">Cleared</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${state.xp}</div>
        <div class="stat-label">Total XP</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${state.notebook.length}</div>
        <div class="stat-label">Notes</div>
      </div>
    </div>

    <div class="section-title">Lectures</div>
    <div class="level-list">
  `;

  LEVELS.forEach((lvl, i) => {
    const prog = state.levelProgress[lvl.id];
    const prevCleared = i === 0 || state.levelProgress[LEVELS[i-1].id].cleared;
    const locked = !prevCleared && !prog.cleared;

    let status = locked ? 'Locked' : (prog.cleared ? '✓ Cleared' : 'Start');
    let bestText = prog.best > 0 ? `Best: ${prog.best}%` : `${lvl.pool.length} in pool`;

    html += `
      <button class="level-card ${prog.cleared ? 'cleared' : ''} ${locked ? 'locked' : ''}"
              ${locked ? 'disabled' : `onclick="startLevel(${lvl.id})"`}>
        <div class="level-num">${lvl.id}</div>
        <div class="level-info">
          <div class="level-name">${lvl.name}</div>
          <div class="level-meta">15 questions · ${bestText}</div>
        </div>
        <div class="level-status">${status}</div>
      </button>
    `;
  });

  const allCleared = LEVELS.every(l => state.levelProgress[l.id].cleared);
  const bossProg = state.levelProgress['boss'];
  const bossLocked = !allCleared && !bossProg.cleared;
  const bossStatus = bossLocked ? 'Clear all 9' : (bossProg.cleared ? '✓ Conquered' : 'Fight');
  const bossBestText = bossProg.best > 0 ? `Best: ${bossProg.best}%` : '25 mixed questions';

  html += `
      <button class="level-card boss ${bossProg.cleared ? 'cleared' : ''} ${bossLocked ? 'locked' : ''}"
              ${bossLocked ? 'disabled' : `onclick="startLevel('boss')"`}>
        <div class="level-num">★</div>
        <div class="level-info">
          <div class="level-name">Cumulative Boss Battle</div>
          <div class="level-meta">${bossBestText}</div>
        </div>
        <div class="level-status">${bossStatus}</div>
      </button>
    </div>
  `;

  document.getElementById('screen-home').innerHTML = html;
}

function startLevel(levelId) {
  let levelData;
  if (levelId === 'boss') {
    levelData = { id: 'boss', name: 'Cumulative Boss Battle', short: 'Boss Battle', isBoss: true };
  } else {
    levelData = LEVELS.find(l => l.id === levelId);
  }

  state.currentLevel = levelData;
  state.currentLevel.questions = pickQuestions(levelId);
  state.currentQ = 0;
  state.hp = 100;
  state.streak = 0;
  state.hintsLeft = 2;
  state.correctCount = 0;
  state.totalAnswered = 0;
  state.answered = false;
  state._xpAtStart = state.xp;
  state.levelProgress[levelId].plays += 1;

  renderQuestion();
}

function renderQuestion() {
  document.getElementById('screen-home').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  document.getElementById('screen-results').classList.add('hidden');

  const q = state.currentLevel.questions[state.currentQ];
  const total = state.currentLevel.questions.length;
  const progress = ((state.currentQ) / total) * 100;

  const typeLabel = {
    mc: 'Multiple Choice',
    tf: 'True or False',
    fill: 'Fill in the Blank',
    scenario: 'Scenario'
  }[q.type] || 'Question';

  let html = `
    <div class="quiz">
      <div class="quiz-header">
        <div class="quiz-header-top">
          <button class="quiz-back" onclick="confirmExit()">← Quit</button>
          <div class="quiz-title">${state.currentLevel.short}</div>
          <div class="quiz-stats">
            <span class="stat-pill hp">♥ ${state.hp}</span>
            ${state.streak > 1 ? `<span class="stat-pill streak">🔥 ${state.streak}</span>` : ''}
          </div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
        <div class="progress-text">Question ${state.currentQ + 1} of ${total}</div>
      </div>

      <div class="question-card">
        <div class="q-type">${typeLabel}${q._from ? ' · ' + q._from : ''}</div>
        ${q.scenario ? `<div class="q-scenario">${q.scenario}</div>` : ''}
        <div class="q-text">${q.q}</div>
        <div id="answer-area"></div>
        <div id="hint-display"></div>
        <div id="feedback-area"></div>
        <div class="hint-row">
          <button class="hint-btn" id="hint-btn" onclick="useHint()" ${state.hintsLeft <= 0 || state.answered ? 'disabled' : ''}>
            💡 Hint (${state.hintsLeft} left)
          </button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('screen-quiz').innerHTML = html;
  renderAnswerArea();
}

function renderAnswerArea() {
  const q = state.currentLevel.questions[state.currentQ];
  const area = document.getElementById('answer-area');

  if (q.type === 'mc' || q.type === 'scenario') {
    const letters = ['A', 'B', 'C', 'D'];
    let html = '<div class="options">';
    q.options.forEach((opt, i) => {
      html += `
        <button class="option" onclick="answerMC(${i})" id="opt-${i}">
          <span class="option-letter">${letters[i]}</span>
          <span>${opt}</span>
        </button>
      `;
    });
    html += '</div>';
    area.innerHTML = html;
  } else if (q.type === 'tf') {
    area.innerHTML = `
      <div class="tf-options">
        <button class="tf-option" onclick="answerTF(true)" id="tf-true">TRUE</button>
        <button class="tf-option" onclick="answerTF(false)" id="tf-false">FALSE</button>
      </div>
    `;
  } else if (q.type === 'fill') {
    area.innerHTML = `
      <div class="fill-input-wrap">
        <input type="text" class="fill-input" id="fill-input"
               placeholder="Type your answer..."
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               onkeydown="if(event.key==='Enter') submitFill()">
        <button class="submit-btn" onclick="submitFill()">Submit</button>
      </div>
    `;
    setTimeout(() => {
      const inp = document.getElementById('fill-input');
      if (inp) inp.focus();
    }, 100);
  }
}

// ============================================================
// ANSWER HANDLING
// ============================================================

function answerMC(i) {
  if (state.answered) return;
  const q = state.currentLevel.questions[state.currentQ];
  const correct = i === q.answer;

  document.querySelectorAll('.option').forEach((el, idx) => {
    el.disabled = true;
    if (idx === q.answer) el.classList.add('correct');
    else if (idx === i && !correct) el.classList.add('incorrect');
  });

  finalizeAnswer(correct, q);
}

function answerTF(val) {
  if (state.answered) return;
  const q = state.currentLevel.questions[state.currentQ];
  const correct = val === q.answer;

  document.getElementById('tf-true').disabled = true;
  document.getElementById('tf-false').disabled = true;

  if (q.answer === true) {
    document.getElementById('tf-true').classList.add('correct');
    if (!correct) document.getElementById('tf-false').classList.add('incorrect');
  } else {
    document.getElementById('tf-false').classList.add('correct');
    if (!correct) document.getElementById('tf-true').classList.add('incorrect');
  }

  finalizeAnswer(correct, q);
}

function submitFill() {
  if (state.answered) return;
  const q = state.currentLevel.questions[state.currentQ];
  const inp = document.getElementById('fill-input');
  const val = inp.value.trim().toLowerCase();
  if (!val) return;

  const correct = q.answer.some(a => {
    const userClean = val.replace(/[^a-z0-9]/g, '');
    const ansClean = a.toLowerCase().replace(/[^a-z0-9]/g, '');
    return val === a.toLowerCase() || userClean === ansClean;
  });
  inp.disabled = true;
  inp.classList.add(correct ? 'correct' : 'incorrect');
  if (!correct) inp.value = `${inp.value}  →  ${q.answer[0]}`;

  finalizeAnswer(correct, q);
}

function finalizeAnswer(correct, q) {
  state.answered = true;
  state.totalAnswered++;
  if (correct) {
    state.correctCount++;
    state.streak++;
    state.xp += (10 + (state.hintsLeft < 2 ? 0 : 5));
    if (state.streak === 3 || state.streak === 5 || state.streak === 7 || state.streak === 10) {
      showStreakFlash(state.streak);
    }
  } else {
    state.streak = 0;
    state.hp = Math.max(0, state.hp - 15);
    if (q.nb && !state.notebook.find(n => n.term === q.nb.term)) {
      state.notebook.push({ ...q.nb, source: state.currentLevel.short });
      updateNotebookCount();
    }
  }

  const hb = document.getElementById('hint-btn');
  if (hb) hb.disabled = true;

  const fa = document.getElementById('feedback-area');
  fa.innerHTML = `
    <div class="feedback ${correct ? 'correct' : 'incorrect'}">
      <div class="feedback-header">
        ${correct ? '✓ Correct!' : '✗ Not quite'}
      </div>
      <div class="feedback-text">${q.explanation}</div>
    </div>
    <button class="next-btn" onclick="nextQuestion()">
      ${state.currentQ + 1 >= state.currentLevel.questions.length ? 'See Results' : 'Next Question'} →
    </button>
  `;
}

function nextQuestion() {
  if (state.currentQ + 1 >= state.currentLevel.questions.length) {
    showResults();
  } else {
    state.currentQ++;
    state.answered = false;
    renderQuestion();
  }
}

function useHint() {
  if (state.hintsLeft <= 0 || state.answered) return;
  state.hintsLeft--;

  const q = state.currentLevel.questions[state.currentQ];
  let hint = '';

  if (q.type === 'mc' || q.type === 'scenario') {
    const wrong = q.options.map((_, i) => i).filter(i => i !== q.answer);
    const toRemove = shuffle(wrong).slice(0, 2);
    toRemove.forEach(i => {
      const el = document.getElementById(`opt-${i}`);
      if (el) { el.style.opacity = '0.3'; el.disabled = true; }
    });
    hint = '50/50: Two incorrect options have been dimmed.';
  } else if (q.type === 'tf') {
    const firstSentence = q.explanation.split('.')[0];
    hint = firstSentence + '. (Now think about whether the statement matches that.)';
  } else if (q.type === 'fill') {
    const ans = q.answer[0];
    hint = `It starts with "${ans[0].toUpperCase()}" and has ${ans.length} letters.`;
  }

  document.getElementById('hint-display').innerHTML = `<div class="hint-text">💡 ${hint}</div>`;

  const hb = document.getElementById('hint-btn');
  hb.innerHTML = `💡 Hint (${state.hintsLeft} left)`;
  if (state.hintsLeft <= 0) hb.disabled = true;
}

function confirmExit() {
  if (confirm('Quit this level? Your progress will be lost.')) {
    renderHome();
  }
}

// ============================================================
// RESULTS
// ============================================================

function showResults() {
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-results').classList.remove('hidden');

  const total = state.currentLevel.questions.length;
  const pct = Math.round((state.correctCount / total) * 100);
  const cleared = pct >= 80;
  const lvlId = state.currentLevel.id;

  if (cleared) {
    state.levelProgress[lvlId].cleared = true;
    fireConfetti();
  }
  if (pct > state.levelProgress[lvlId].best) {
    state.levelProgress[lvlId].best = pct;
  }

  let title = cleared ? 'Level Cleared!' : 'Keep Going';
  let icon = cleared ? '★' : '↻';
  let sub = cleared
    ? `You scored ${pct}% — that unlocks the next level. Replay this one anytime for a fresh set of questions.`
    : `You need 80% to clear this level. Review your notebook and try again — different questions each time.`;

  const xpEarned = state.xp - state._xpAtStart;
  const replayLabel = `'${typeof lvlId === 'string' ? lvlId : lvlId}'`;

  let html = `
    <div class="results">
      <div class="results-icon">${icon}</div>
      <div class="results-title">${title}</div>
      <div class="results-sub">${sub}</div>

      <div class="results-stats">
        <div class="results-stat">
          <div class="results-stat-value">${pct}%</div>
          <div class="results-stat-label">Score</div>
        </div>
        <div class="results-stat">
          <div class="results-stat-value">${state.correctCount}/${total}</div>
          <div class="results-stat-label">Correct</div>
        </div>
        <div class="results-stat">
          <div class="results-stat-value">+${xpEarned}</div>
          <div class="results-stat-label">XP Earned</div>
        </div>
      </div>

      <div class="results-actions">
        <button class="action-btn primary" onclick="startLevel(${typeof lvlId === 'string' ? "'"+lvlId+"'" : lvlId})">
          ${cleared ? 'Replay (New Questions)' : 'Try Again'}
        </button>
        <button class="action-btn secondary" onclick="openNotebook()">
          Review Notebook (${state.notebook.length})
        </button>
        <button class="action-btn tertiary" onclick="renderHome()">
          ← Back to Levels
        </button>
      </div>
    </div>
  `;

  document.getElementById('screen-results').innerHTML = html;
}

// ============================================================
// NOTEBOOK
// ============================================================

function openNotebook() {
  const body = document.getElementById('drawer-body');
  if (state.notebook.length === 0) {
    body.innerHTML = `
      <div class="nb-empty">
        Your notebook is empty.<br><br>
        When you miss a question, the key term will be saved here for review.
      </div>
    `;
  } else {
    body.innerHTML = state.notebook.map(n => `
      <div class="nb-item">
        <div class="nb-term">${n.term}</div>
        <div class="nb-def">${n.def}</div>
        <div class="nb-source">From: ${n.source}</div>
      </div>
    `).join('');
  }
  document.getElementById('drawer-backdrop').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeNotebook() {
  document.getElementById('drawer-backdrop').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function updateNotebookCount() {
  document.getElementById('nb-count').textContent = state.notebook.length;
}

// ============================================================
// FX
// ============================================================

function fireConfetti() {
  const container = document.createElement('div');
  container.className = 'confetti';
  document.body.appendChild(container);

  const colors = ['#003366', '#FDB827', '#fff4d6', '#1a4d80'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 0.5) + 's';
    piece.style.animationDuration = (2.5 + Math.random() * 1.5) + 's';
    if (Math.random() > 0.5) piece.style.borderRadius = '50%';
    container.appendChild(piece);
  }
  setTimeout(() => container.remove(), 4000);
}

function showStreakFlash(n) {
  const flash = document.createElement('div');
  flash.className = 'streak-flash';
  flash.textContent = `${n} in a row!`;
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 1200);
}

// ============================================================
// INIT
// ============================================================
renderHome();
updateNotebookCount();
</script>
